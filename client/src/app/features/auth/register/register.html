<div class="auth-page">
  <mat-card appearance="outlined" class="auth-card">
    <mat-card-header>
      <mat-card-title>Create an account</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (error()) {
        <app-error-message [error]="error()!"></app-error-message>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>First name</mat-label>
          <input matInput formControlName="firstName" autocomplete="given-name" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Last name</mat-label>
          <input matInput formControlName="lastName" autocomplete="family-name" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="plainPassword" autocomplete="new-password" />
          <mat-hint>At least 14 characters</mat-hint>
        </mat-form-field>

        <button mat-flat-button type="submit" [disabled]="form.invalid || submitting()">
          Sign up
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <span>Already have an account?</span>
      <a routerLink="/login">Log in</a>
    </mat-card-actions>
  </mat-card>
</div>
